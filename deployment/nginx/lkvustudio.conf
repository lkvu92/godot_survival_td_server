server {
    listen 80;
    server_name lkvustudio.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lkvustudio.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lkvustudio.com;

    ssl_certificate /etc/nginx/ssl/live/lkvustudio.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/lkvustudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;

    location = /app-ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        return 200 "google.com, pub-2623237649967496, DIRECT, f08c47fec0942fa0\n";
    }

    location = /app-ads.tx {
        return 308 /app-ads.txt;
    }

    location = /ttl/privacy-policy {
        return 308 /ttl/privacy-policy/;
    }
    location = /ttl/privacy-policy/index.html {
        return 308 /ttl/privacy-policy/$is_args$args;
    }
    location = /ttl/privacy-policy/ {
        root /etc/nginx/conf.d;
        try_files /ttl-pages/privacy-policy.html =404;
        default_type text/html;
        charset utf-8;
        auth_basic off;
        auth_request off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=300";
    }

    location = /ttl/delete-account {
        return 308 /ttl/delete-account/;
    }
    location = /ttl/delete-account/index.html {
        return 308 /ttl/delete-account/$is_args$args;
    }
    location = /ttl/delete-account/ {
        root /etc/nginx/conf.d;
        try_files /ttl-pages/delete-account.html =404;
        default_type text/html;
        charset utf-8;
        auth_basic off;
        auth_request off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        return 404;
    }
}
