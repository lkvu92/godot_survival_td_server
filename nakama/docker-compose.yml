services:
  postgres:
    container_name: nakama-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-nakama}"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    container_name: nakama-server
    image: heroiclabs/nakama:3.24.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required in .env}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?Required in .env}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:?Required in .env}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?Required in .env}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:?Required in .env}
      NAKAMA_CONSOLE_MFA_KEY: ${NAKAMA_CONSOLE_MFA_KEY:?Required in .env}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY:?Required in .env}
      NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY: ${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY:?Required in .env}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:?Required in .env}
      MONETIZATION_VERIFIER_SECRET: ${MONETIZATION_VERIFIER_SECRET:?Required in .env}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      MULTI_SERVER_ENABLED: "true"
      ACCOUNT_IDENTITY_ENABLED: ${ACCOUNT_IDENTITY_ENABLED:-false}
      ACCOUNT_IDENTITY_SECRET: ${ACCOUNT_IDENTITY_SECRET:-}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-vn.lkvu92.survivaltd}
      CONFIG_ADMIN_USER_ID: ${CONFIG_ADMIN_USER_ID:?Required in .env}
      GOOGLE_PLAY_TESTER_EMAILS: ${GOOGLE_PLAY_TESTER_EMAILS:-}
      ADMOB_REWARDED_UNIT_ID_DEVELOP: ${ADMOB_REWARDED_UNIT_ID_DEVELOP:-ca-app-pub-3940256099942544/5224354917}
      ADMOB_REWARDED_UNIT_ID_PRODUCTION: ${ADMOB_REWARDED_UNIT_ID_PRODUCTION:?Required in .env}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up --config /run/secrets/nakama-runtime.yml &&
        exec /nakama/nakama --config /nakama/data/local.yml --config /run/secrets/nakama-iap.yml --config /run/secrets/nakama-runtime.yml
    ports:
      - "${NAKAMA_GRPC_BIND:-127.0.0.1}:${NAKAMA_GRPC_PORT:-7349}:7349" # gRPC API
      - "${NAKAMA_HTTP_BIND:-127.0.0.1}:${NAKAMA_HTTP_PORT:-7350}:7350" # HTTP API
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-7351}:7351" # Console
    volumes:
      - ./data:/nakama/data
      - ./iap.secret.yml:/run/secrets/nakama-iap.yml:ro
      - type: bind
        source: ./runtime.secret.yml
        target: /run/secrets/nakama-runtime.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      default:
      public_proxy:
        aliases:
          - survival-td-nakama

  sweep-worker:
    image: python:3.12-alpine
    command: ["python", "-B", "/app/sweep_tick.py"]
    environment:
      NAKAMA_URL: http://nakama:7350
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:?Required}
    volumes:
      - ./sweep_tick.py:/app/sweep_tick.py:ro
    depends_on:
      nakama:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.25

  mail-worker:
    image: python:3.12-alpine
    command: ["python", "-B", "/app/mail_tick.py"]
    environment:
      NAKAMA_URL: http://nakama:7350
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:?Required}
    volumes:
      - ./mail_tick.py:/app/mail_tick.py:ro
    depends_on:
      nakama:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.25

  monetization-verifier:
    container_name: survival-td-monetization-verifier
    build:
      context: ../services/monetization-verifier
    image: survival-td-monetization-verifier:local
    depends_on:
      nakama:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_ENVIRONMENT: "${APP_ENVIRONMENT:-production}"
      MONETIZATION_VERIFIER_SECRET: "${MONETIZATION_VERIFIER_SECRET:?Required in .env}"
      ADMOB_REWARDED_UNIT_ID_DEVELOP: "${ADMOB_REWARDED_UNIT_ID_DEVELOP:-ca-app-pub-3940256099942544/5224354917}"
      ADMOB_REWARDED_UNIT_ID_PRODUCTION: "${ADMOB_REWARDED_UNIT_ID_PRODUCTION:-ca-app-pub-2623237649967496/5496497462}"
      NAKAMA_DEVELOP_URL: "http://nakama:7350"
      NAKAMA_PRODUCTION_URL: "${NAKAMA_PRODUCTION_URL:-http://nakama:7350}"
      NAKAMA_HTTP_KEY: "${NAKAMA_HTTP_KEY:?Required in .env}"
      GOOGLE_PUBSUB_AUDIENCE: "${GOOGLE_PUBSUB_AUDIENCE:-http://localhost:8082/google-play/rtdn}"
      GOOGLE_PLAY_PACKAGE_NAME: "${ANDROID_PACKAGE_NAME:-vn.lkvu92.survivaltd}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-play-service-account.json
    volumes:
      - type: bind
        source: ./google-play-service-account.json
        target: /run/secrets/google-play-service-account.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${MONETIZATION_BIND:-127.0.0.1}:${MONETIZATION_PORT:-8082}:8080"
    restart: unless-stopped
    networks:
      default:
      public_proxy:
        aliases:
          - survival-td-monetization-verifier

  account-identity:
    profiles: ["identity"]
    build:
      context: ../services/account-identity
    environment:
      PORT: "8080"
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-nakama}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Required}
      NAKAMA_URL: http://nakama:7350
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:?Required}
      ACCOUNT_IDENTITY_SECRET: ${ACCOUNT_IDENTITY_SECRET:-}
      ACCOUNT_IDENTITY_OUTBOX_KEY: ${ACCOUNT_IDENTITY_OUTBOX_KEY:-}
      ACCOUNT_IDENTITY_PUBLIC_URL: ${ACCOUNT_IDENTITY_PUBLIC_URL:-https://api.lkvustudio.com}
      GOOGLE_WEB_CLIENT_IDS: ${GOOGLE_WEB_CLIENT_IDS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-admin@lkvustudio.com}
    volumes:
      - ../public/privacy-policy:/app/documents/privacy-policy:ro
      - ../public/delete-account:/app/documents/delete-account:ro
    ports:
      - "127.0.0.1:${ACCOUNT_IDENTITY_PORT:-18083}:8080"
    depends_on:
      nakama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    networks:
      default:
      public_proxy:
        aliases: [survival-td-account-identity]

volumes:
  pgdata:

networks:
  public_proxy:
    external: true
    name: source_truyen24h-net
